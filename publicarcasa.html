<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar casa</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="publicarcasa.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
    <header>
        <h1>Bienvenido a CASA+ el lugar para tu casa ideal</h1>
    </header>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2 mt-5">
                <h2 class="text-center">REGISTRO DE CASAS</h2>
                <form action="guardarcasas.php" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Descripción de la Casa</label>
                        <input type="text" name="Descasa" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Precio</label>
                        <input type="number" name="precventa" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Imagen de la Casa</label>
                        <input type="file" name="imagecasa" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="municipio">Municipio:</label>
                        <select id="municipio" name="municipio" class="form-control" onchange="actualizarBarrios();">
                            <option value=""></option> <!-- Opción vacía para iniciar sin selección -->
                            <option value="atizapan">Atizapán</option>
                            <option value="nicolas">Nicolás Romero</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="barrio">Barrio:</label>
                        <select id="barrio" name="barrio" class="form-control">
                            <option value=""></option> <!-- Opción vacía para iniciar sin selección -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tamaño (m²)</label>
                        <input type="text" name="tamano" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Numero de habitaciones</label>
                        <input type="number" name="habitaciones" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Amueblada</label>
                        <select name="amueblada" class="form-control" required>
                            <option value="">Seleccione una opción</option>
                            <option value="si">Sí</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <div id="map" style="height: 400px;"></div>
                        <input type="hidden" name="latitud" id="latitud">
                        <input type="hidden" name="longitud" id="longitud">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Enviar</button>
                    <button type="reset" class="btn btn-secondary btn-block">Limpiar</button>
                </form>
            </div>
        </div>
    </div>
    <nav>
        <ul>
            <a href="inicio.html" class="btn">Inicio</a>
        </ul>
    </nav>
    <footer>
        <p>© 2024 Mi Página Web</p>
    </footer>
    <script src="mostrarbarrios.js"></script>
    <script>
        var map = L.map('map').setView([19.4326, -99.1332], 13); // Coordenadas iniciales (Ciudad de México)

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var marker;
        map.on('click', function(e) {
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }
            document.getElementById('latitud').value = e.latlng.lat;
            document.getElementById('longitud').value = e.latlng.lng;
        });
    </script>
</body>
</html>
