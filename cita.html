<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Programar Cita</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cita.css">
</head>
<body>
    <header>
        <h1>Bienvenido a CASA+ el lugar para tu casa ideal</h1>
    </header>
    <!-- Contenido Principal -->
    <div class="contenedor-formulario">
        <form action="citas.php" method="post" id="formCita">
            <div class="form-group">
                <label class="form-label" for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label" for="fecha">Fecha</label>
                <input type="date" id="fecha" name="fecha" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label" for="hora">Hora</label>
                <input type="time" id="hora" name="hora" required class="form-input">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Confirmar Cita</button>
                <button type="button" onclick="history.back()" class="btn btn-secondary">Cancelar</button>
            </div>
        </form>
    </div>
    <!-- Footer -->
    <footer>
        <p>© 2024 Tu Empresa. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
